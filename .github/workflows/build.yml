name: Build RSDKv5

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Build Solution
        run: |
          msbuild RSDKv5.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSDKv5-windows-x64
          path: |
            x64/Release/*.exe
            x64/Release/*.dll
            bin/x64/Release/*.exe
            bin/x64/Release/*.dll
